# /etc/nginx/sites-available/web_design
# 独立站点：仅占用 80 端口。
# EMQX 使用 1883 / 8883 / 8083 / 8084 / 18083，与本配置无交集。

# ---------------------------------------------------------------------------
# 首页主视觉随机：每个请求等概率分配到 5 个场景之一。
# $request_id 每次请求唯一，split_clients 按哈希均分，无需脚本或后端。
# 同一次请求内，HTML 中所有 __HERO__ 占位符被替换成同一个值，
# 因此 <link rel=preload> 与 <img> 始终指向同一张图，不会重复下载。
# ---------------------------------------------------------------------------
split_clients "$request_id" $hero_scene {
    20%  "sea";
    20%  "city";
    20%  "sunset";
    20%  "market";
    *    "camp";
}

# 每张图的替代文字，随场景一起替换
map $hero_scene $hero_alt {
    default "小哭包和宝宝依偎在一起";
    sea     "小哭包和宝宝依偎在海边草地上，远处有轮船航过海面";
    city    "小哭包和宝宝在城市霓虹灯下的河边依偎";
    sunset  "小哭包和宝宝在夕阳下的河畔依偎";
    market  "小哭包和宝宝在夜市里分享小吃";
    camp    "小哭包和宝宝在星空下的帐篷旁露营";
}

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    root  /var/www/web_design;
    index index.html;

    charset utf-8;

    access_log /var/log/nginx/web_design.access.log;
    error_log  /var/log/nginx/web_design.error.log warn;

    # 占位符替换（sub_filter 默认只作用于 text/html，无需显式声明）
    sub_filter "__HERO_ALT__" $hero_alt;
    sub_filter "__HERO__"     $hero_scene;
    sub_filter_once off;

    # 健康检查，供监控或负载均衡探测
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # 静态资源长缓存（expires 会同时设置 Expires 与 Cache-Control，勿重复 add_header）
    location ~* \.(?:css|js|mjs|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf)$ {
        expires 7d;
        try_files $uri =404;
    }

    # HTML 必须每次回源，否则浏览器 304 复用旧响应、随机就失效了：
    # 关掉 ETag / Last-Modified 协商，并禁止缓存。
    location ~* \.html$ {
        sendfile off;
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # 游玩感言历史 API 反向代理到本地后台服务
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}
